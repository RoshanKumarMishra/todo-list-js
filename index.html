<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>

<body style="background-color: black; color: white; font-family: Arial, sans-serif; text-align: center;">

    <h1>TO DO LIST</h1>

    <form>
        <input 
            type="text" 
            name="task" 
            id="task"
            required
            style="width: 300px; height: 30px; border-radius: 5px; border: none; padding: 5px;"
        >

        <button 
            type="submit" 
            style="width: 100px; height: 30px; border-radius: 5px; border: none; background-color: #007bff; color: white;"
        >
            Add
        </button>
    </form>

    <br><br>

    <div id="allTask"></div>

    <script src="./first.js"></script>

</body>
</html>
